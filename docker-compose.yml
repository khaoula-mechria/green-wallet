services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_PATH: /app/data/green-wallet.db
      # CORS_ORIGIN is intentionally unset: the frontend reaches the API
      # same-origin through nginx, so no cross-origin access is allowed.
      # Required — the backend refuses to boot with missing/placeholder secrets.
      # Put them in a .env file next to this one (see .env.example).
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
      KEY_ENCRYPTION_SECRET: ${KEY_ENCRYPTION_SECRET:?set KEY_ENCRYPTION_SECRET in .env (see .env.example)}
      # Demo features: off unless explicitly enabled in .env.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      SIMULATION_ENABLED: ${SIMULATION_ENABLED:-false}
      MANUAL_MEASUREMENTS_ENABLED: ${MANUAL_MEASUREMENTS_ENABLED:-false}
      DEMO_MARKET_ACTIVITY: ${DEMO_MARKET_ACTIVITY:-false}
      WELCOME_GRANT_TEC: ${WELCOME_GRANT_TEC:-10}
      # Operator console (/admin): closed unless set (>= 12 characters).
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-}
      SIMULATION_TICK_MS: 5000
      SIMULATION_MINUTES_PER_TICK: 30
      # Leave blank (default) for local/simulated blockchain mode. See backend/.env.example.
      HEDERA_OPERATOR_ID: ${HEDERA_OPERATOR_ID:-}
      HEDERA_OPERATOR_KEY: ${HEDERA_OPERATOR_KEY:-}
      HEDERA_TOKEN_ID: ${HEDERA_TOKEN_ID:-}
    volumes:
      - green-wallet-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  green-wallet-data:
